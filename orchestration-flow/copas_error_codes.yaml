# ═══════════════════════════════════════════════════════════════════════════════
#  COPAS Error Code registry — the auditor's controlled vocabulary.
#  Source: "COPAS Error coding.xlsx" (lead-provided, exhaustive 70-code list).
#  This is the DETERMINISTIC classifier key: every audit exception carries one of
#  these codes (field `error_type`), so category is looked up, not inferred.
#
#  Per code:
#    category  — coarse grouping for triage/heatmaps
#    family    — the domain sub-area (drives which rules/agents are relevant)
#    tier_hint — automation difficulty prior (1=low-hanging, 2=multi-agent+HITL, 3=hard)
#                (a PRIOR only; final tier still set by the scorer using $ + evidence)
# ═══════════════════════════════════════════════════════════════════════════════
